name: Publish to PyPI
# Trusted publishing: no token is stored anywhere. PyPI trusts this workflow once the project
# owner adds it as a (pending) trusted publisher for "plate-toolkit" on pypi.org.
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
