name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install the built wheel
        shell: python
        run: |
          import glob, subprocess, sys
          wheel, = glob.glob('dist/*.whl')
          print('installing', wheel)
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', wheel])

      - name: Doctor, outside the checkout, with an empty Plate home
        shell: python
        run: |
          import json, os, subprocess, sys, tempfile
          with tempfile.TemporaryDirectory() as work:
              env = dict(os.environ, PLATE_HOME=os.path.join(work, 'plate-home'))
              env.pop('PLATE_LICENSE_KEY', None)
              env.pop('PLATE_LIBRARY', None)
              result = subprocess.run([sys.executable, '-m', 'plate_toolkit', 'doctor'],
                                      cwd=work, env=env, capture_output=True, text=True)
              print(result.stdout or result.stderr)
              report = json.loads(result.stdout)
              assert result.returncode == 0, result.returncode
              assert report['ok'], report
              assert len(report['mcp']['tools']) == 10, report['mcp']['tools']

      - name: Free smoke tests against the installed package
        shell: python
        run: |
          import os, subprocess, sys, tempfile
          tests = os.path.abspath('tests')
          with tempfile.TemporaryDirectory() as work:
              env = dict(os.environ, PLATE_HOME=os.path.join(work, 'plate-home'))
              env.pop('PLATE_LICENSE_KEY', None)
              env.pop('PLATE_LIBRARY', None)
              subprocess.check_call([sys.executable, '-m', 'unittest', 'discover',
                                     '-s', tests, '-t', tests, '-v'], cwd=work, env=env)
