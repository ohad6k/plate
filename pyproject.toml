[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plate-toolkit"
version = "1.1.0"
description = "MCP design tools for Claude Code, Codex and Cursor: capture, check and improve what your coding agent builds. Companion to Plate (getplate.pages.dev)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ohad Krispin" }]
keywords = ["mcp", "design", "agent", "claude", "codex", "cursor"]
dependencies = ["Pillow>=10.4,<13"]

[project.optional-dependencies]
capture = ["playwright>=1.52,<2"]

[project.urls]
Homepage = "https://getplate.pages.dev/"
Documentation = "https://github.com/ohad6k/plate/blob/codex/starter/docs/QUICKSTART.md"
Repository = "https://github.com/ohad6k/plate"

[project.scripts]
plate = "plate_toolkit.cli:main"
plate-toolkit = "plate_toolkit.cli:main"

[tool.setuptools]
packages = ["plate_toolkit", "plate_toolkit.runtime"]
include-package-data = false
