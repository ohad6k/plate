<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Plate: give your agent eyes for design">
  <title>Plate</title>
  <desc>The Plate mark above the headline "Give your agent eyes for design" and the names of the ten free tools.</desc>
  <defs>
    <clipPath id="plate-mark-clip"><rect width="384" height="384" rx="96"/></clipPath>
    <radialGradient id="plate-ground" cx="50%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#15161A"/>
      <stop offset="62%" stop-color="#0B0B0B"/>
      <stop offset="100%" stop-color="#070708"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="400" rx="20" fill="url(#plate-ground)"/>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="19.5" fill="none" stroke="#1E1F23"/>

  <g transform="translate(556 54) scale(0.229167)">
    <g clip-path="url(#plate-mark-clip)">
      <rect width="192" height="384" fill="#F2F2F0"/>
      <rect x="192" width="24" height="384" fill="#FF5C00"/>
      <rect x="216" width="168" height="384" fill="#0B0B0B"/>
    </g>
    <rect x="1" y="1" width="382" height="382" rx="95" fill="none" stroke="#26272B" stroke-width="2"/>
  </g>

  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="216" fill="#F5F5F3" font-size="56" font-weight="600" letter-spacing="-1.4">Give your agent eyes for design</text>
    <text x="600" y="262" fill="#9AA1AC" font-size="20" font-weight="400">Capture what it built, resolve real assets, check the result.</text>
    <text x="600" y="300" fill="#6C727C" font-size="16" font-weight="400">Claude Code · Codex · Cursor</text>
    <text x="600" y="358" fill="#7C818A" font-size="12.5" font-weight="500" letter-spacing="2.6">BRIEF · CATALOG · RESOLVE · KIT · STACK · CAPTURE · INSPECT · CHECK · PAIR · LICENSE</text>
  </g>

  <rect x="560" y="326" width="80" height="2" fill="#FF5C00"/>
</svg>
